name: formal

on: [push, pull_request]

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SymbiYosys (YoWASP) and Z3
        run: |
          sudo apt-get update && sudo apt-get install -y z3
          pip install yowasp-yosys
      - name: Prove the pin/timing unit, the loader and the top level
        run: make -C formal SBY=yowasp-sby
