# Tiny Tapeout project information
project:
  title:        "PinV - RISC-V protocol emulator"      # Project title
  author:       "Edouard Guillermain"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Reprogrammable protocol emulator: RV32E core with deterministic timing and pin I/O instructions"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     40000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_edoouuard_protoemu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "pinv_io.v"
    - "pinv_loader.v"
    - "picorv32.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "GPIO in 0 (UART RX in demo)"
  ui[1]: "GPIO in 1"
  ui[2]: "GPIO in 2"
  ui[3]: "GPIO in 3"
  ui[4]: "GPIO in 4"
  ui[5]: "LOADER MOSI / GPIO in 5"
  ui[6]: "LOADER SCK / GPIO in 6"
  ui[7]: "LOAD (high = program load, core held in reset)"

  # Outputs
  uo[0]: "GPIO out 0 (UART TX in demo)"
  uo[1]: "GPIO out 1"
  uo[2]: "GPIO out 2"
  uo[3]: "GPIO out 3"
  uo[4]: "GPIO out 4"
  uo[5]: "GPIO out 5"
  uo[6]: "GPIO out 6"
  uo[7]: "GPIO out 7"

  # Bidirectional pins
  uio[0]: "GPIO bidir 0"
  uio[1]: "GPIO bidir 1"
  uio[2]: "GPIO bidir 2"
  uio[3]: "GPIO bidir 3"
  uio[4]: "GPIO bidir 4"
  uio[5]: "GPIO bidir 5"
  uio[6]: "GPIO bidir 6"
  uio[7]: "GPIO bidir 7"

# Do not change!
yaml_version: 6
