name: formal

on: [push, pull_request]

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SymbiYosys (YoWASP) and the Yices solver
        run: pip install yowasp-yosys yices-solver
      - name: Prove the pin/timing unit, timing non-interference, the loader and the top level
        run: make -C formal SBY=yowasp-sby
